version: '3.8'

services:
  crewai-job-app:
    build: .
    container_name: crewai-job-app
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-3.5-turbo}
      - API_KEY=${API_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hireai-frontend
    ports:
      - "5173:80"  # nginx serves on port 80
    depends_on:
      - crewai-job-app
